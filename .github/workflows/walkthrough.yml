name: Capture client walkthrough visuals
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  capture:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Capture actual application demo states
        run: dotnet run --project tools/GpuPower.Capture -c Release
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: walkthrough-app-captures
          path: captures/
